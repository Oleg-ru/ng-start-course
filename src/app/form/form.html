<div class="flex flex-wrap justify-center  gap-8 items-center">
  <div class="flex flex-col w-1/4 border rounded p-3 shadow-2xl" [formGroup]="form">
    <label class="label">
      <p>Login</p>
      <input class="input" type="text" formControlName="login">
      @if (!form.controls.login.valid && form.controls.login.touched) {
        <div class="error-msg">Login обязателен</div>
      }
    </label>
    <label class="label">
      <p>Email</p>
      <input class="input z-1" type="email" formControlName="email">
      @if (!form.controls.email.valid && form.controls.email.touched) {
        @if (form.controls.email.hasError('required')) {
          <div class="error-msg z-0">Email обязателен</div>
        } @else if (form.controls.email.hasError('email')) {
          <div class="error-msg z-0">Допустимый формат example&#64;domen.ru</div>
        }
      }
    </label>
    <label class="label">
      <p>Password</p>
      <input class="input" type="password" formControlName="password">
      @if (!form.controls.password.valid && form.controls.password.touched) {
        @if (form.controls.password.hasError('required')) {
          <div class="error-msg">Password обязателен</div>
        } @else if (form.controls.password.hasError('minlength')) {
          <div class="error-msg">Минимум 6 символов</div>
        }
      }
    </label>
    <button (click)="handleSubmit()" [disabled]="!form.valid" class="mt-2 border rounded p-1 bg-blue-400 cursor-pointer hover:bg-blue-500 active:text-amber-50 delay-75 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed">Submit</button>
  </div>

  <div [formGroup]="loginForm" class="flex flex-col w-1/4 border rounded p-3 shadow-2xl">
    <h2>Login form</h2>
    <hr>
    <label class="label">
      Email
      <input class="input" type="text" formControlName="mail">
      @if (!loginForm.controls.mail.valid && loginForm.controls.mail.touched) {
        @if (loginForm.controls.mail.hasError('forbiddenValue')) {
          <div class="error-msg z-0">Неккоректный формат Email</div>
        }
      }
    </label>
    <label class="label">
      <p>Password</p>
      <input class="input" type="password" formControlName="password">
    </label>
    <label class="label">
      <p>Confirm password</p>
      <input class="input" type="password" formControlName="confirmPassword">
    </label>
    <div>
      @if (loginForm.errors?.['PasswordsNotEquals'] && loginForm.controls.password.touched && loginForm.controls.confirmPassword.touched) {
        <div  class="relative p-4">
          <div class="error-msg">Пароли не совпадают</div>
        </div>
      }
    </div>
  </div>

  <form [formGroup]="fbForm" (ngSubmit)="onSubmit()" class="flex flex-col w-1/4 border rounded p-3 shadow-2xl">
    <label class="label">
      Name
      <input class="input" type="text" formControlName="name">
    </label>
    <div formArrayName="skills" >
      @for (skill of skills.controls; track skill; let i = $index) {
        <div [formGroupName]="i" class="input flex gap-1 mt-2">
          <label class="label">
            {{i + 1}} | Skill 🔑
            <input type="text" formControlName="skill" class="input">
          </label>
          <label class="label">
            Experience
            <input type="text" formControlName="experience" class="input">
          </label>
          <button (click)="removeSkill(i)" class="cursor-pointer" title="Delete skill">❌</button>
        </div>
      }
    </div>
    <button (click)="addSkill()" class="w-full border rounded mt-2 p1 bg-blue-400 cursor-pointer hover:bg-blue-500 active:text-amber-50 delay-75 ">Add skill</button>

    <button type="submit" class="w-full border rounded mt-2 p1 bg-green-400 cursor-pointer hover:bg-green-500 active:text-amber-50 delay-75 ">Submit</button>
  </form>

  <div class="flex flex-col gap-2 w-1/4 border rounded p-3 shadow-2xl">
    <div>
      <pre>
        {{templateForm | json}}
      </pre>
    </div>
    <h2>Template login form</h2>
    <label class="label">
      User login
      <input type="text" class="input" [(ngModel)]="templateForm.user">
    </label>
    <label class="label">
      Email
      <input type="email" class="input" [(ngModel)]="templateForm.email">
    </label>
    <label class="label">
      Password
      <input type="password" class="input" [(ngModel)]="templateForm.password">
    </label>
  </div>
</div>
