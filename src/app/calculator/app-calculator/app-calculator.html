<div class="flex flex-col gap-3  items-center h-full w-full mt-10">
  <div class="flex flex-col gap-2 border rounded w-1/6 p-3 shadow-2xl">
    <input [(ngModel)]="operand_a" class="border p-1 rounded"/>
    <select [(ngModel)]="operation" class="border rounded cursor-pointer">
      @for (operation of operations; track $index) {
        <option [value]="operation">{{operation}}</option>
      }
    </select>
    <input [(ngModel)]="operand_b" class="border p-1 rounded"/>
    <button (click)="calculate(); logCalculation()" class="border rounded p-1 bg-emerald-500 text-white cursor-pointer hover:bg-emerald-600 delay-75 active:text-black">
      Посчитать
    </button>
    <div>{{result()}}</div>
  </div>
  @if (hasHistory) {
    <div class="border rounded w-1/6 p-3 mt-4 shadow-2xl">
      <app-history />
    </div>
  }
</div>
