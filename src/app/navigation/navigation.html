<ul class="flex gap-1  rounded-xl shadow-lg p-1 border border-gray-200 w-fit bg-slate-800">
  @for (route of routes; track $index) {
    <li>
      <a
        [routerLink]="['/', route.url]"
        routerLinkActive="bg-blue-600 text-white shadow-md"
        class="block px-4 py-2 rounded-lg text-amber-50 font-medium transition-all duration-200 hover:bg-blue-50 hover:text-blue-600"
      >
        {{ route.urlName }}
      </a>
    </li>
  }
</ul>
